    <!-- 1. FULL-PAGE BACKGROUND IMAGE (100% PURE WHITE PAPER CONVERSION + TEXT ERASER) -->
    <img
        id="gazetteBgImageEl"
        src="/images/gazette_bg.jpg"
        crossorigin="anonymous"
        style="position: absolute !important; top: 0 !important; left: 0 !important; width: 794px !important; height: 1122px !important; object-fit: fill !important; z-index: 1 !important; pointer-events: none !important; user-select: none !important; background-color: #ffffff !important; filter: grayscale(100%) brightness(1.15) contrast(1.3) !important;"
        onload="
            if (!this.dataset.cleaned) {
                this.dataset.cleaned = '1';
                try {
                    var c = document.createElement('canvas');
                    c.width = 794;
                    c.height = 1122;
                    var ctx = c.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, 794, 1122);
                    ctx.drawImage(this, 0, 0, 794, 1122);

                    /* Strip all yellow/cream/grey pixels -> Pure RGB(255,255,255) White */
                    var imgData = ctx.getImageData(0, 0, 794, 1122);
                    var d = imgData.data;
                    for (var i = 0; i < d.length; i += 4) {
                        var avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
                        if (avg > 165) {
                            d[i] = 255;
                            d[i + 1] = 255;
                            d[i + 2] = 255;
                            d[i + 3] = 255;
                        } else {
                            var dark = Math.max(0, Math.floor(avg * 0.65));
                            d[i] = dark;
                            d[i + 1] = dark;
                            d[i + 2] = dark;
                            d[i + 3] = 255;
                        }
                    }
