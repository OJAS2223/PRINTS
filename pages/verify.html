<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#060b19">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <title>Document Verification - Ojas Print Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/theme.js?v=9.1"></script>
    <link rel="stylesheet" href="/css/theme.css?v=9.1">
</head>
<body class="bg-slate-100 dark:bg-dark-950 font-sans min-h-screen flex flex-col justify-between text-slate-800 dark:text-slate-100">
    <header class="bg-dark-950 shadow-lg px-4 py-3 flex justify-between items-center border-b border-royal-500/40">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center p-1 border border-slate-200">
                <img src="/images/logo.png" alt="Ojas Logo" class="w-full h-full object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1211/1211833.png'">
            </div>
            <div>
                <h1 class="text-sm md:text-base font-black text-white">Ojas <span class="text-royal-400">Verification</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Public QR Document Check</p>
            </div>
        </div>
        <a href="/portal" class="bg-royal-500 hover:bg-royal-400 text-dark-950 font-black px-3.5 py-2 rounded-xl text-xs transition">
            <i class="fa-solid fa-house mr-1"></i> Portal
        </a>
    </header>

    <main class="max-w-xl mx-auto w-full p-4 md:p-6 flex-grow flex items-center justify-center">
        <div id="verifyCard" class="bg-white dark:bg-dark-900 w-full rounded-3xl shadow-card border border-slate-200 dark:border-slate-700 p-6 md:p-8 space-y-5">
            <div id="verifyLoading" class="text-center py-8 space-y-3">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-royal-500"></i>
                <p class="text-xs font-bold text-slate-500">डॉक्यूमेंट रिकॉर्ड वेरीफाई हो रहा है...</p>
            </div>

            <div id="verifySuccess" class="hidden space-y-4">
                <div class="text-center space-y-2 border-b border-slate-100 dark:border-slate-800 pb-4">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mx-auto border border-emerald-300">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <span class="inline-block bg-emerald-100 text-emerald-800 border border-emerald-300 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">Verified Record</span>
                    <h2 class="text-lg font-black text-dark-900 dark:text-white">Document Authenticity Confirmed</h2>
                </div>
                <div id="verifyDetailsGrid" class="space-y-2.5 text-xs"></div>
            </div>

            <div id="verifyError" class="hidden text-center py-6 space-y-3">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center text-3xl mx-auto border border-red-300">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
                <h2 class="text-lg font-black text-red-700">Record Not Found</h2>
                <p id="verifyErrorMsg" class="text-xs font-semibold text-slate-500">यह डॉक्यूमेंट ID डेटाबेस में मौजूद नहीं है या अमान्य है।</p>
            </div>
        </div>
    </main>

    <footer class="bg-dark-950 border-t border-slate-800 text-center py-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
        © 2026 Ojas Print Service (ojasprints.in) | QR Verification
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCjvAVdtOWmyDx4MPYW-0UPsAj7UKEKCuo",
            authDomain: "upeprint.firebaseapp.com",
            projectId: "upeprint",
            storageBucket: "upeprint.firebasestorage.app",
            messagingSenderId: "28101043239",
            appId: "1:28101043239:web:5f90bfa0929583d0b5da02"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function runVerification() {
            const loadingEl = document.getElementById('verifyLoading');
            const successEl = document.getElementById('verifySuccess');
            const errorEl = document.getElementById('verifyError');
            const gridEl = document.getElementById('verifyDetailsGrid');

            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const urlParams = new URLSearchParams(window.location.search);
            const docId = urlParams.get('id') || (pathParts[0] === 'verify' ? pathParts[1] : pathParts[pathParts.length - 1]);

            if (!docId || docId === 'verify' || docId === 'verify.html') {
                loadingEl.classList.add('hidden');
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const snap = await getDoc(doc(db, "history", docId));
                loadingEl.classList.add('hidden');

                if (!snap.exists()) {
                    errorEl.classList.remove('hidden');
                    return;
                }

                const data = snap.data();
                const fd = data.formData || {};
                const sec = data.timestamp?.seconds || Math.floor(Date.now() / 1000);
                const dateStr = new Date(sec * 1000).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
                const holderName = fd.NAME || fd.applicantName || fd.parentName || fd.childName || fd.NEW_NAME || data.fileName || 'N/A';
                const refNo = fd.CERT_NO || fd.APPLICATION_REF || fd.REG_NO || fd.EPIC_NO || fd.PASSPORT_NO || snap.id;

                const rows = [
                    ['Document ID', snap.id],
                    ['Service Type', data.serviceType || 'Certificate'],
                    ['Holder / Applicant', holderName],
                    ['Reference / Number', refNo],
                    ['Issued / Generated On', dateStr]
                ];

                gridEl.innerHTML = rows.map(([k, v]) => `
                    <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 dark:bg-dark-800 border border-slate-200 dark:border-slate-700 gap-2">
                        <span class="font-bold text-slate-500">${k}</span>
                        <span class="font-black text-dark-900 dark:text-white text-right break-all">${String(v).replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
                    </div>
                `).join('');

                successEl.classList.remove('hidden');
            } catch (err) {
                loadingEl.classList.add('hidden');
                document.getElementById('verifyErrorMsg').innerText = 'वेरिफिकेशन त्रुटि: ' + err.message;
                errorEl.classList.remove('hidden');
            }
        }

        runVerification();
    </script>
</body>
</html>
